<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="STATE" height="269px" preserveAspectRatio="none" style="width:1263px;height:269px;background:#FFFFFF;" version="1.1" viewBox="0 0 1263 269" width="1263px" zoomAndPan="magnify"><title>Lifecycle of a DiagnosticReport</title><defs/><g><g class="title" data-source-line="1"><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="209.2686" x="520.0796" y="24.5332">Lifecycle of a DiagnosticReport</text></g><g id="Registered"><rect fill="#F1F1F1" height="52.7031" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="202.7715" x="7" y="158.6094"/><line style="stroke:#181818;stroke-width:0.5;" x1="7" x2="209.7715" y1="186.2188" y2="186.2188"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="67.7031" x="74.5342" y="178.1426">Registered</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="182.7715" x="12" y="203.6758">Photographer has stored the form.</text></g><g id="Partial"><rect fill="#F1F1F1" height="52.7031" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="133.3965" x="360" y="158.6094"/><line style="stroke:#181818;stroke-width:0.5;" x1="360" x2="493.3965" y1="186.2188" y2="186.2188"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="39.6826" x="406.8569" y="178.1426">Partial</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="113.3965" x="365" y="203.6758">Ready for AI grading.</text></g><g id="Preliminary"><rect fill="#F1F1F1" height="52.7031" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="208.1152" x="673" y="107.6094"/><line style="stroke:#181818;stroke-width:0.5;" x1="673" x2="881.1152" y1="135.2188" y2="135.2188"/><text fill="#000000" font